name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy numpy-stl matplotlib pytest
      - run: python -m pytest tool/tests/ -q
        env: { MPLBACKEND: Agg }
